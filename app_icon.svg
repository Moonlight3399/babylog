<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9A9E"/>
      <stop offset="100%" style="stop-color:#FECFEF"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#bg)"/>

  <!-- 时钟圆环 -->
  <circle cx="100" cy="88" r="52" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>

  <!-- 时钟刻度：12,3,6,9 -->
  <line x1="100" y1="44" x2="100" y2="52" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="144" y1="88" x2="136" y2="88" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="132" x2="100" y2="124" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="56" y1="88" x2="64" y2="88" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- 时针（指向10，代表喂奶时刻） -->
  <line x1="100" y1="88" x2="82" y2="60" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- 分针（指向2） -->
  <line x1="100" y1="88" x2="118" y2="58" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- 中心奶嘴图标（奶嘴 + 瓶盖） -->
  <g transform="translate(100, 88)">
    <!-- 瓶盖环 -->
    <rect x="-16" y="-4" width="32" height="8" rx="4" ry="4" fill="#FFFFFF" opacity="0.9"/>
    <!-- 奶嘴主体 -->
    <path d="M-10,-4 C-10,-18 10,-18 10,-4 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- 奶嘴顶部圆点 -->
    <circle cx="0" cy="-14" r="3" fill="#FF9A9E"/>
  </g>

  <!-- 品牌文字 -->
  <text x="100" y="172" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="3">
    BabyLog
  </text>
</svg>