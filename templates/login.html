<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BabyLog - 登录</title>

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/32x32.png">
    <meta name="theme-color" content="#FF69B4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BabyLog">
    <link rel="apple-touch-icon" href="/static/icons/192x192.png">
    <link rel="icon" type="image/png" href="/static/icons/192x192.png">

    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-logo">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                <circle cx="32" cy="32" r="30" fill="#FFB6C1" stroke="#FF69B4" stroke-width="2"/>
                <circle cx="24" cy="26" r="3" fill="#FF69B4"/>
                <circle cx="40" cy="26" r="3" fill="#FF69B4"/>
                <path d="M22 40 Q32 50 42 40" stroke="#FF69B4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <ellipse cx="32" cy="46" rx="4" ry="2" fill="#FF69B4"/>
                <text x="32" y="58" text-anchor="middle" font-size="7" fill="#FF69B4" font-weight="bold">Baby</text>
            </svg>
        </div>
        <h1 class="login-title">BabyLog</h1>
        <p class="login-subtitle">宝宝成长记录</p>
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <input type="text" id="username" placeholder="用户名" autocomplete="username" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="密码" autocomplete="current-password" required>
            </div>
            <div id="loginError" class="login-error" style="display:none;"></div>
            <button type="submit" class="btn btn-primary btn-full" id="loginBtn">登 录</button>
        </form>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const errDiv = document.getElementById('loginError');
        btn.disabled = true;
        btn.textContent = '登录中...';
        errDiv.style.display = 'none';

        try {
            const resp = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                })
            });
            const data = await resp.json();
            if (data.ok) {
                window.location.href = '/';
            } else {
                errDiv.textContent = data.error || '登录失败';
                errDiv.style.display = 'block';
            }
        } catch (err) {
            errDiv.textContent = '网络错误，请重试';
            errDiv.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.textContent = '登 录';
        }
    });

    </script>

    <!-- Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
    </script>
</body>
</html>
